<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enterprise Cloud Service Catalog</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background: rgba(255,255,255,0.08);
            padding: 45px 30px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .student {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 12px;
            margin: 25px 0;
            line-height: 2;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            background: #38bdf8;
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #7dd3fc;
            transform: translateY(-3px);
        }

        footer {
            margin-top: 30px;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>☁️ Enterprise Cloud Service Catalog</h1>

        <p>Explore cloud services and monitor system health.</p>

        <div class="student">
            <h2>Student Details</h2>
            <p><strong>Name:</strong> ANWIN JOHNY<p>
            <p><strong>Roll Number:</strong>2648016</p>
        </div>

        <p>Access the cloud catalog API endpoints below.</p>

        <div class="buttons">

            <button onclick="window.location.href='/api/services'">
                View Cloud Services
            </button>

            <button onclick="window.location.href='/api/status'">
                Check System Status
            </button>

        </div>

        <footer>
            Cloud Service Catalog | Node.js & Express
        </footer>

    </div>

</body>
</html>
